services:

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: smartrestaurant-web
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 8000 SmartRestaurant.asgi:application"
    # Port 8000 is reached by the frontend's nginx over shared-net; the host
    # only gets a loopback binding (see the ports below).
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend
      - shared-net
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/core/health/').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.26.2-alpine
    container_name: smartrestaurant-nginx
    depends_on:
      - web
    ports:
      - "127.0.0.1:8800:8800"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8800/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17.2
    container_name: smartrestaurant-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    container_name: smartrestaurant-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redisinsight:
    image: redis/redisinsight:2.62
    container_name: smartrestaurant-redisinsight
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:5540/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: smartrestaurant-celery
    command: celery -A SmartRestaurant worker -l info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - backend
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "celery -A SmartRestaurant inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  celery-beat:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: smartrestaurant-celery-beat
    command: celery -A SmartRestaurant beat -l info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - backend
    restart: on-failure

volumes:
  postgres_data:
  static_volume:
    name: backend_static_volume
  redisinsight_data:

networks:
  backend:
    driver: bridge
  shared-net:
    external: true